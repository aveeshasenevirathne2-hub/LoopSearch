<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Toast</title>
  <link rel="stylesheet" href="./styles/liquid-glass.css" />
  <style>
    .toast-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
    }
    .toast-pill {
      position: relative;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(8, 12, 26, 0.94);
      border: 1px solid rgba(125, 211, 252, 0.42);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.52), 0 0 18px rgba(56, 189, 248, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      animation: toastPop 0.36s var(--spring-snappy) both;
    }
    .toast-pill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 25%, rgba(186, 230, 253, 0.18) 50%, transparent 75%);
      transform: translateX(-100%);
      animation: toastShimmer 1.1s var(--ease-silk) 0.12s forwards;
      pointer-events: none;
    }
    .toast-icon {
      color: #38bdf8;
      display: flex;
      align-items: center;
      animation: toastIconPop 0.42s var(--spring-snappy) 0.06s both;
    }
    .toast-pill.success .toast-icon { color: #4ade80; }
    .toast-pill.error .toast-icon { color: #f87171; }
    @keyframes toastPop {
      0% { opacity: 0; transform: translateY(14px) scale(0.88); }
      72% { opacity: 1; transform: translateY(-1.5px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastIconPop {
      from { opacity: 0; transform: scale(0.5) rotate(-18deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes toastShimmer {
      to { transform: translateX(120%); }
    }
  </style>
</head>
<body>
  <div class="toast-wrap">
    <div class="toast-pill" id="toast-pill">
      <div class="top-specular-rim" style="left:16px;right:16px;height:1.5px;"></div>
      <span class="toast-icon" id="toast-icon"></span>
      <span id="toast-msg"></span>
    </div>
  </div>

  <script src="./js/motion-and-glass.js"></script>
  <script>
    (function () {
      const { Icons, applyGlassAppearance } = window.LoopUI;
      window.loopSearch.onToastInit(({ message, kind, settings }) => {
        if (settings) applyGlassAppearance(settings);
        const pill = document.getElementById('toast-pill');
        pill.className = 'toast-pill ' + (kind || 'info');
        pill.style.animation = 'none';
        void pill.offsetWidth;
        pill.style.animation = '';
        document.getElementById('toast-icon').innerHTML =
          kind === 'success' ? Icons.check(14) : Icons.sparkle(14);
        document.getElementById('toast-msg').textContent = message || '';
      });
    })();
  </script>
</body>
</html>
